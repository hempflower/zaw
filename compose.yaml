services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zaw
      MYSQL_USER: zaw
      MYSQL_PASSWORD: zaw
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [mysql-data:/var/lib/mysql]
volumes:
  mysql-data:
