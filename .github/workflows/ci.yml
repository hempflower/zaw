name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ZAW_MYSQL_TEST_DSN: zaw:zaw@tcp(127.0.0.1:3306)/zaw_test?parseTime=true&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zaw_test
          MYSQL_USER: zaw
          MYSQL_PASSWORD: zaw
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uzaw -pzaw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.0
      - name: Install frontend dependencies
        run: task deps -- --frozen-lockfile
      - name: Validate vendored protocols
        run: task check-protocols
      - name: Run quality checks
        run: task lint
      - name: Run tests
        run: task test
      - name: Build
        run: task build
