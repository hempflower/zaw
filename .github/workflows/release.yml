name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          test "$(go run ./cmd/zaw version)" = "$version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist provider-build
          go build -trimpath -ldflags='-s -w' -o dist/zaw-linux-amd64 ./cmd/zaw
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=".exe"; fi
            binary="provider-build/terraform-provider-zaw_v${version}${suffix}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags='-s -w' -o "$binary" ./cmd/terraform-provider-zaw
            (cd provider-build && zip -q -j \
              "../dist/terraform-provider-zaw_${version}_${os}_${arch}.zip" \
              "$(basename "$binary")")
          done
          (cd dist && sha256sum zaw-linux-amd64 terraform-provider-zaw_*.zip > SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag
          --generate-notes
          --title "Zaw $RELEASE_TAG"
